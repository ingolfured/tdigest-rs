[package]
name    = "tdigest-rs"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
description = "Mergeable TDigest in Rust with Python, Polars, and Java bindings"
license = "Apache-2.0"
repository = "https://github.com/G-Research/tdigest-rs"
homepage = "https://github.com/G-Research/tdigest-rs"
documentation = "https://docs.rs/tdigest-rs"
readme = "README.md"
keywords = ["tdigest", "quantile", "cdf", "statistics", "polars"]
categories = ["algorithms", "data-structures", "science"]

[lib]
name       = "tdigest_rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = [
  "dep:pyo3",
  "dep:numpy",
  "dep:pyo3-polars",
  "dep:polars-core",
  "dep:polars-arrow",
  "dep:polars-plan",
]
java = ["dep:jni"]

[dependencies]
polars       = { version = "0.55.1", default-features = false, features = ["dtype-struct", "dtype-array"] }
polars-core  = { version = "0.55.1", optional = true }
polars-arrow = { version = "0.55.1", optional = true }
polars-plan  = { version = "0.55.1", optional = true }

jni          = { version = "0.21", optional = true }
clap         = { version = "4.5", features = ["derive"] }

pyo3-polars  = { version = "0.28", features = ["derive"], optional = true }
pyo3         = { version = "0.29.3", features = ["extension-module", "abi3-py310"], optional = true }
numpy        = { version = "0.29.0", optional = true }

ordered-float  = { version = "5.1.0", features = ["serde"] }
rayon          = "1.11"
serde          = { version = "1.0.228", features = ["derive"] }
serde_json     = "1.0.145"
crc32fast      = "1.4.2"

# jemalloc on Linux only (safer TLS flag for some distros)
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }

[dev-dependencies]
rand          = "0.9.2"
testdata = { path = "crates/testdata" }
criterion     = "0.5"
bytesize      = "1"
libc          = "0.2"
assert_fs     = "1"
predicates    = "3"
assert_cmd    = "2"

[[bin]]
name = "tdigest"
path = "src/bin/tdigest_cli.rs"

[[bench]]
name = "codecs_bench"
harness = false

[[bench]]
name = "cdf_quantile_bench"
harness = false

[[bench]]
name = "tdigest_bench"
harness = false

[workspace]
members  = [".", "crates/testdata"]
resolver = "2"

[profile.release]
strip = false

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
jemalloc-ctl = "0.5"
