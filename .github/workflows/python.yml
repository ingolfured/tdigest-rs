name: Python
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  DEFAULT_PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Python ${{ env.DEFAULT_PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          check-latest: true
      - name: Install locked development tools
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked --no-install-project --project bindings/python --group dev --python 3.12
      - name: Check Python formatting and pinned sources
        run: |
          uv run --project bindings/python --no-sync ruff check --config bindings/python/pyproject.toml bindings/python scripts/check_python_sdist.py scripts/test_legacy_wheel.py scripts/test_python_support.py scripts/test_python_interfaces.py scripts/prepare_release_sdist.py
          uv run --project bindings/python --no-sync ruff format --check --config bindings/python/pyproject.toml bindings/python scripts/check_python_sdist.py scripts/test_legacy_wheel.py scripts/test_python_support.py scripts/test_python_interfaces.py scripts/prepare_release_sdist.py
          uv run --project bindings/python --no-sync python scripts/check_upstream_sources.py

  test:
    name: Test
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        runner: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked --no-install-project --project bindings/python --group dev --python ${{ matrix.python-version }}
      - name: Build extension
        run: uv run --no-sync maturin develop --release --locked
        working-directory: bindings/python
      - name: Test original and modern installed interfaces
        run: uv run --project bindings/python --no-sync python scripts/test_python_interfaces.py

  runtime-support:
    name: Installed GNU x86_64 release wheel and NumPy matrix
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Prepare build tools
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked --no-install-project --project bindings/python --group dev --python 3.12
      - name: Download the actual GNU x86_64 release wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-x86_64-unknown-linux-gnu
          path: downloaded-release-wheel
      - name: Create and check source archive without compiling an extension
        run: uv run --project bindings/python --no-sync python scripts/prepare_release_sdist.py --output-dir checked-sdist
      - name: Test the downloaded release wheel across seven isolated environments
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(downloaded-release-wheel/*.whl)
          sdists=(checked-sdist/sdist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one downloaded release wheel and one checked source archive"
            exit 1
          fi
          uv run --project bindings/python --no-sync python scripts/test_python_support.py \
            --wheel "${wheels[0]}" --sdist "${sdists[0]}" --output-dir support-results
      - name: Upload checked source archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-package-sdist
          path: checked-sdist/sdist/*.tar.gz
          if-no-files-found: error
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: runtime-support-evidence
          path: |
            support-results/*.json
            support-results/*.xml
            support-results/*.log
            checked-sdist/*.json
            checked-sdist/*.log

  build:
    name: Build
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: build
          args: --release --locked --out ../../target/wheels
          manylinux: auto
          target: ${{ matrix.target }}
          working-directory: bindings/python
      - name: Upload Python Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-package-${{ matrix.target }}
          path: target/wheels/*.whl
          if-no-files-found: error
