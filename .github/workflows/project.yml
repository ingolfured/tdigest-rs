name: Cross-language project

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Rust, Python, Polars and JVM contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.9.5
          uv sync --locked --no-install-project --project bindings/python --group dev --python 3.12
      - name: Build all surfaces
        run: make build
      - name: Test all surfaces and original compatibility
        run: make test
      - name: Verify standalone JVM artifact
        run: bindings/java/gradlew --no-daemon --console=plain -p bindings/java smoke verifyJava11Bytecode
      - name: Extended accuracy regression checks
        run: make quality-regression
      - name: Retain separate legacy, cross-language and accuracy results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-results
          path: |
            build/quality/
            build/ci/*.xml
            bindings/java/build/test-results/test/*.xml
          if-no-files-found: ignore
